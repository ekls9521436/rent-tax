<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租金扣繳與稅金計算機｜住商不動產 林佳麒 C.C.LIN</title>
  <style>
    :root { --primary: #006837; --bg: #f4f7f5; --card: #ffffff; --text: #222; --muted: #666; --border: #dce5df; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
    .container { width: 100%; max-width: 460px; background: var(--card); border-radius: 16px; padding: 22px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 20px; color: var(--primary); }
    .header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .main-tabs { display: grid; grid-template-columns: 1fr 1fr; background: #eaf1ec; padding: 4px; border-radius: 10px; margin-bottom: 16px; }
    .tab { text-align: center; padding: 9px 4px; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; color: var(--muted); }
    .tab.active { background: var(--primary); color: #fff; }
    .form-group { margin-bottom: 14px; }
    label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input[type="number"], select { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 10px; background: #fafcfb; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .radio-item {
      display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px;
      border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: #fafcfb;
    }
    .radio-item.checked { border-color: var(--primary); background: #eef5f1; color: var(--primary); }
    .result-box { background: #f0f7f3; border: 1px solid #cce3d5; border-radius: 12px; padding: 16px; margin-top: 14px; }
    .result-main { text-align: center; padding-bottom: 12px; border-bottom: 1px dashed #b9d6c4; }
    .result-main .title { font-size: 13px; color: var(--muted); }
    .result-main .amount { font-size: 28px; font-weight: 800; color: var(--primary); margin: 4px 0; }
    .result-details { margin-top: 12px; font-size: 13px; display: grid; gap: 8px; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; }
    .detail-row span:last-child { font-weight: 700; }
    .highlight-row { border-top: 1px dashed #b9d6c4; padding-top: 8px; color: var(--primary); font-size: 14px; }
    .deadline-tip { margin-top: 10px; padding: 8px 10px; background: #fff; border-radius: 8px; font-size: 12px; color: #b45309; font-weight: 600; text-align: center; border: 1px solid #fde68a; }
    .cta-btn { display: block; width: 100%; text-align: center; margin-top: 16px; padding: 13px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 700; font-size: 15px; border-radius: 10px; }
    .note { text-align: center; font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>租金扣繳與稅金計算機</h1>
      <p>住商不動產 建國民生加盟店｜林佳麒 C.C.LIN</p>
    </div>

    <div class="main-tabs">
      <div class="tab active" id="nav-withhold" onclick="switchPanel('withhold')">公司租賃扣繳 (含/未稅)</div>
      <div class="tab" id="nav-annual" onclick="switchPanel('annual')">房東年度綜所稅
