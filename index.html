<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租金扣繳與稅金計算機｜住商不動產 林佳麒 C.C.LIN</title>
<style>
:root{--p:#006837;--bg:#f4f7f5;--c:#fff;--t:#222;--m:#666;--b:#dce5df}
*{box-sizing:border-box;font-family:-apple-system,"Noto Sans TC",sans-serif}
body{margin:0;padding:16px;background:var(--bg);color:var(--t);display:flex;justify-content:center}
.box{width:100%;max-width:460px;background:var(--c);border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.hd{text-align:center;border-bottom:1px solid var(--b);padding-bottom:12px;margin-bottom:14px}
.hd h1{margin:0;font-size:20px;color:var(--p)}.hd p{margin:4px 0 0;font-size:13px;color:var(--m)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eaf1ec;padding:4px;border-radius:10px;margin-bottom:14px}
.tab{text-align:center;padding:8px 4px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--m)}
.tab.on{background:var(--p);color:#fff}
.fg{margin-bottom:12px}label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,select{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--b);border-radius:10px;background:#fafcfb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ri{text-align:center;padding:10px;border:1px solid var(--b);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#fafcfb}
.ri.on{border-color:var(--p);background:#eef5f1;color:var(--p)}
.res{background:#f0f7f3;border:1px solid #cce3d5;border-radius:12px;padding:14px;margin-top:12px}
.rm{text-align:center;padding-bottom:10px;border-bottom:1px dashed #b9d6c4}
.rm .ti{font-size:13px;color:var(--m)}.rm .am{font-size:28px;font-weight:800;color:var(--p);margin:4px 0}
.rd{margin-top:10px;font-size:13px;display:grid;gap:7px}
.dr{display:flex;justify-content:space-between}.dr span:last-child{font-weight:700}
.hl{border-top:1px dashed #b9d6c4;padding-top:7px;color:var(--p);font-size:14px}
.tip{margin-top:10px;padding:9px 10px;background:#fff;border-radius:8px;font-size:12px;color:#333;line-height:1.5;border:1px solid var(--b)}
.btn{display:block;width:100%;text-align:center;margin-top:14px;padding:13px;background:var(--p);color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:10px}
.nt{text-align:center;font-size:11px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <div class="hd">
    <h1>租金扣繳與稅金計算機</h1>
    <p>住商不動產 建國民生加盟店｜林佳麒 C.C.LIN</p>
  </div>
  <div class="tabs">
    <div class="tab on" id="n1" onclick="sw(1)">公司租賃扣繳 (含/未稅)</div>
    <div class="tab" id="n2" onclick="sw(2)">房東年度綜所稅試算</div>
  </div>
  <div id="p1">
    <div class="fg">
      <label>房東身分</label>
      <select id="lt" onchange="cw()">
        <option value="local" selected>本國個人房東 (扣繳10% + 二代健保2.11%)</option>
        <option value="foreign">非居住者/外國人 (扣繳20%，免二代健保)</option>
        <option value="corp">法人/公司房東 (免扣繳健保，需開發票)</option>
      </select>
    </div>
    <div class="fg">
      <label>每期租金金額 (元)</label>
      <input type="number" id="wr" value="88880" oninput="cw()" onchange="cw()">
      <div class="rg">
        <div class="ri on" id="o1" onclick="stm('inc')">● 租金已含稅</div>
        <div class="ri" id="o2" onclick="stm('exc')">○ 租金未稅 (實拿)</div>
      </div>
    </div>
    <div class="res">
      <div class="rm">
        <div class="ti" id="wt1">實際支付房東租金 (未稅實拿)</div>
        <div class="am" id="wa1">$78,117 元</div>
      </div>
      <div class="rd">
        <div class="dr"><span>每期租金總額 (含稅)：</span><span id="wg">$88,880 元</span></div>
        <div class="dr"><span id="wtl">代扣所得稅 (10%)：</span><span id="wt">$8,888 元</span></div>
        <div class="dr"><span>代扣二代健保 (2.11%)：</span><span id="wn">$1,875 元</span></div>
        <div class="dr hl"><span>租扣＋二代健保總金額：</span><span id="wd">$10,763 元</span></div>
        <div class="dr hl"><span>實際支付房東 (未稅)：</span><span id="wnet">$78,117 元</span></div>
      </div>
      <div class="tip" id="wdead" style="color:#b45309;font-weight:600;text-align:center">※ 本國個人房東：承租公司應於次月 10 日前繳納扣繳稅款書</div>
    </div>
  </div>
  <div id="p2" style="display:none">
    <div class="tabs">
      <div class="tab on" id="s1" onclick="sam('normal')">一般自然人出租</div>
      <div class="tab" id="s2" onclick="sam('charity')">公益出租人 (1.5萬免稅)</div>
    </div>
    <div class="row">
      <div class="fg"><label>每月租金 (元)</label><input type="number" id="ar" value="25000" oninput="ca()" onchange="ca()"></div>
      <div class="fg"><label>房東綜所稅率</label>
        <select id="art" onchange="ca()">
          <option value="0.05">5% (59萬內)</option>
          <option value="0.12" selected>12% (59~133萬)</option>
          <option value="0.20">20% (133~266萬)</option>
          <option value="0.30">30% (266~498萬)</option>
          <option value="0.40">40% (498萬以上)</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>全年出租月數</label>
      <select id="am" onchange="ca()">
        <option value="12" selected>12 個月 (全年)</option>
        <option value="10">10 個月</option>
        <option value="6">6 個月</option
    document.getElementById('w-deadline').innerText = '※ 外國人/非居住者：承租公司應於給付日起 10 日內完成扣繳申報';
        if (taxMode === 'inc') {
          gross = inputAmt;
          tax = Math.floor(gross * 0.20);
          net = gross - tax;
        } else {
          net = inputAmt;
          gross = Math.round(net / 0.80);
          tax = gross - net;
        }
      } else {
        document.getElementById('w-tax-label').innerText = '代扣所得稅 (10%)：';
        document.getElementById('w-deadline').innerText = '※ 本國個人房東：承租公司應於次月 10 日前繳納扣繳稅款書';
        if (taxMode === 'inc') {
          gross = inputAmt;
          var rawTax = Math.floor(gross * 0.10);
          tax = (rawTax > 2000) ? rawTax : 0;
          nhi = (gross >= 20000) ? Math.floor(gross * 0.0211) : 0;
          net = gross - tax - nhi;
        } else {
          net = inputAmt;
          var estGross = net / 0.8789;
          if (Math.floor(estGross * 0.10) > 2000 && estGross >= 20000) {
            gross = Math.floor(net / 0.8789);
            tax = Math.floor(gross * 0.10);
            nhi = Math.floor(gross * 0.0211);
            if (gross - tax - nhi < net) { gross += 1; tax = Math.floor(gross * 0.10); nhi = Math.floor(gross * 0.0211); }
          } else if (net / 0.9789 >= 20000) {
            gross = Math.round(net / 0.9789);
            tax = 0;
            nhi = Math.floor(gross * 0.0211);
          } else {
            gross = net;
            tax = 0;
            nhi = 0;
          }
        }
      }

      if (taxMode === 'inc') {
        document.getElementById('w-main-title').innerText = '實際支付房東租金 (未稅實拿)';
        document.getElementById('w-main-amt').innerText = fmt(net);
      } else {
        document.getElementById('w-main-title').innerText = '承租方需編列租金總額 (含稅)';
        document.getElementById('w-main-amt').innerText = fmt(gross);
      }

      document.getElementById('w-gross').innerText = fmt(gross);
      document.getElementById('w-tax').innerText = fmt(tax);
      document.getElementById('w-nhi').innerText = fmt(nhi);
      document.getElementById('w-total-deduct').innerText = fmt(tax + nhi);
      document.getElementById('w-net').innerText = fmt(net);
    }

    function calcAnnual() {
      var rate = parseFloat(document.getElementById('a-rate').value) || 0.12;
      var rent = parseFloat(document.getElementById('a-rent').value) || 0;
      var months = parseInt(document.getElementById('a-months').value) || 12;

      var gross = rent * months;
      var exempt = (annualMode === 'charity') ? Math.min(gross, 15000 * months) : 0;
      var afterExempt = Math.max(0, gross - exempt);
      var exp = afterExempt * 0.43;
      var net = Math.max(0, afterExempt - exp);
      var tax = net * rate;

      document.getElementById('a-tax').innerText = fmt(tax);
      document.getElementById('a-gross').innerText = fmt(gross);
      document.getElementById('a-exempt').innerText = fmt(exempt);
      document.getElementById('a-exp').innerText = fmt(exp);
      document.getElementById('a-net').innerText = fmt(net);

      var tipEl = document.getElementById('a-tip');
      if (annualMode === 'normal') {
        var charityExempt = Math.min(gross, 15000 * months);
        var charityTax = Math.max(0, (gross - charityExempt) * 0.57 * rate);
        var diff = Math.max(0, tax - charityTax);
        tipEl.innerHTML = '💡 <b>節稅提示：</b>一般出租直接扣除 43% 必要費用；若房客申請租金補貼轉作<b>公益出租人</b>，每年可再省綜所稅 <b>' + fmt(diff) + '</b>，且房屋稅與地價稅享自用住宅優惠稅率！';
      } else {
        tipEl.innerHTML = '💡 <b>公益出租人優勢：</b>享每月 15,000 元免稅額，超過部分再扣 43% 必要費用，房屋稅與地價稅同步比照自用住宅稅率。';
      }
    }

    window.onload = function() {
      calcWithhold();
      calcAnnual();
    };
  </script>
</body>
</html>
